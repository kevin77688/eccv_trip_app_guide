name: Deploy travel guide to GitHub Pages
run-name: Publish travel guide (${{ github.event_name }})${{ inputs.note && format(' — {0}', inputs.note) || '' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      note:
        description: Optional note for this manual publish
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Keep the source PDFs out of the public deployed site.
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
