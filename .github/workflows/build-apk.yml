name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets to Android project
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECCV-2026-Guide-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK for Release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ECCV-2026-Guide.apk

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          RELEASE_TITLE: ${{ startsWith(github.ref, 'refs/tags/') && format('ECCV 2026 Guide {0}', github.ref_name) || 'ECCV 2026 Guide (Latest Build)' }}
        run: |
          notes_file="$(mktemp)"
          cat > "${notes_file}" <<'EOF'
          ### ECCV 2026 歐洲旅程導覽 Android 離線 App (APK)

          - 包含 14 天完整行程、航班、住宿、景點與 65 項行李清單
          - App 內建網站，行程內容可完全離線開啟
          - 支援暗色模式、離線匯率快取，以及由 [Google Translate](https://translate.google.com/) 提供技術支援、可預先下載的 ML Kit 離線文字／照片翻譯
          - 安裝後請先連 Wi-Fi，在「小工具 → 翻譯」下載約 180 MB 離線語言包

          **下載方式**：點擊下方 Assets 中的 `ECCV-2026-Guide.apk` 即可直接在 Android 手機上下載並安裝。
          EOF
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_TITLE}" --notes-file "${notes_file}"
          else
            gh release create "${RELEASE_TAG}" --title "${RELEASE_TITLE}" --notes-file "${notes_file}" --target "${GITHUB_SHA}"
          fi
          gh release upload "${RELEASE_TAG}" ECCV-2026-Guide.apk --clobber
