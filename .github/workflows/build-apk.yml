name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate itinerary timing and private-file exclusions
        run: npm test

      - name: Sync web assets to Android project
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECCV-2026-Guide-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK for Release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ECCV-2026-Guide.apk

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          RELEASE_TITLE: ${{ startsWith(github.ref, 'refs/tags/') && format('ECCV 2026 Guide {0}', github.ref_name) || 'ECCV 2026 Guide (Latest Build)' }}
        run: |
          notes_file="$(mktemp)"
          cat > "${notes_file}" <<'EOF'
          ### ECCV 2026 歐洲旅程導覽 Android 離線 App (APK)

          - 14 天行程提供「現在的安排／接下來」、日期切換，以及票券和導航捷徑；時間依各地時區顯示。
          - 「隨身資訊」集中放票券、住宿與緊急聯絡；行李清單有 67 項，預設顯示還沒收的物品。
          - 行程內建於 APK。私人票券不附在安裝檔，請到「交通 → 票券」匯入自己的 .enc 檔，出示時仍需密碼。
          - 「小工具 → 設定」可檢查離線準備。離線翻譯由 [Google Translate](https://translate.google.com/) 提供技術支援，請先連上 Wi-Fi，在「翻譯」下載約 180 MB 語言包。

          **下載方式**：點擊下方 Assets 中的 `ECCV-2026-Guide.apk` 即可直接在 Android 手機上下載並安裝。
          EOF
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_TITLE}" --notes-file "${notes_file}"
          else
            gh release create "${RELEASE_TAG}" --title "${RELEASE_TITLE}" --notes-file "${notes_file}" --target "${GITHUB_SHA}"
          fi
          gh release upload "${RELEASE_TAG}" ECCV-2026-Guide.apk --clobber
